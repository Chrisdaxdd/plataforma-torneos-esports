services:
  - type: web
    name: torneos-service
    runtime: docker
    dockerfilePath: ./torneos-service/Dockerfile
    dockerContext: ./torneos-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8081
      - key: MONGODB_URI
        value: mongodb+srv://pinedadanilo422_db_user:3005273383@cristianpc.uh76d8q.mongodb.net/db_torneos?retryWrites=true&w=majority

  - type: web
    name: matchmaking-service
    runtime: docker
    dockerfilePath: ./matchmaking-service/Dockerfile
    dockerContext: ./matchmaking-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8083
      - key: MONGODB_URI
        value: mongodb+srv://pinedadanilo422_db_user:3005273383@cristianpc.uh76d8q.mongodb.net/db_matchmaking?retryWrites=true&w=majority

  - type: web
    name: frontend-web
    runtime: docker
    dockerfilePath: ./frontend-web/Dockerfile
    dockerContext: ./frontend-web
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8082
      - key: TORNEOS_API_URL
        fromService:
          type: web
          name: torneos-service
          property: host
      - key: MATCHMAKING_API_URL
        fromService:
          type: web
          name: matchmaking-service
          property: host
