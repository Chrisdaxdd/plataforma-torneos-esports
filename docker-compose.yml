version: '3.8'

services:
  torneos-service:
    build:
      context: ./torneos-service
      dockerfile: Dockerfile
    container_name: torneos-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://pinedadanilo422_db_user:3005273383@cristianpc.uh76d8q.mongodb.net/db_torneos?retryWrites=true&w=majority}
    restart: unless-stopped

  matchmaking-service:
    build:
      context: ./matchmaking-service
      dockerfile: Dockerfile
    container_name: matchmaking-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://pinedadanilo422_db_user:3005273383@cristianpc.uh76d8q.mongodb.net/db_matchmaking?retryWrites=true&w=majority}
    restart: unless-stopped

  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: frontend-web
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - TORNEOS_API_URL=http://torneos-service:8081
      - MATCHMAKING_API_URL=http://matchmaking-service:8083
    depends_on:
      - torneos-service
      - matchmaking-service
    restart: unless-stopped
